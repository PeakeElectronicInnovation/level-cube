; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = Upload_UPDI

[env]
platform = atmelmegaavr
framework = arduino
board = ATtiny1606
monitor_speed = 115200
; WS2812 CCL/SPI driver: SmoothLedCcl.h (MIT, mattshepcar/SmoothLed) is vendored in
; lib/SmoothLedCcl with a fix for 0-series parts, so no registry dependency is needed.
build_flags =
    ; Uncomment to enable UART debug output on PB2 (115200 baud)
    ; -DDEBUG

[env:Upload_UPDI]
upload_protocol = atmelice_updi
upload_flags =
